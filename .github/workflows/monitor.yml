# GitHub Actions 定时工作流：站点延迟监控
#
# 调度说明（重要）：
# - GitHub 免费账号对 schedule 定时触发有节流，实际大约每 3~5 小时才触发一次，
#   无论 cron 写 */5 还是 */30 都一样。因此"2 小时窗口内随机访问 10 次"这种
#   密集调度**不能只靠 schedule**。
# - 本工作流提供双驱动：
#     1) schedule（cron */5）：仅作备份，实际频率受 GitHub 节流限制；
#     2) repository_dispatch（event_type=tick）：由外部免费定时服务
#        （cron-job.org 等）每 5 分钟调用 Vercel 的 /api/tick 触发，
#        不受 schedule 节流影响，是密集调度的主驱动。
# - 是否真正执行探测由 monitor.py 根据 sites.json 的配置判断
#   （每个站点独立调度：fixed 模式按该站点 interval_hours 判断；
#    random 模式按该站点 last_run.sites[url].next_ts 判断；
#    window_runs 模式按窗口内随机时间点判断，窗口结束自动循环，无总次数限制）
# - 因此"间隔多久/多久之内随机访问多少次"可在网页上随意修改，不需要再改动本文件
#
# 额度提示：外部定时器 + schedule 合计约 8640 次运行/月。
#   - 仓库为 Public：Actions 免费无额度限制，推荐保持 Public；
#   - 若转 Private：每月 2000 分钟免费额度会紧张，需降低外部定时频率。
#
# 部署前必须开启仓库权限：
#   仓库 Settings -> Actions -> General -> Workflow permissions
#   -> 勾选 Read and write permissions
#
# 手动测试：仓库 Actions 页 -> Site Latency Monitor -> Run workflow
#   （勾选 force_all 可强制访问所有站点，忽略调度与次数限制，
#    与网页"立即运行一轮"按钮行为一致）

name: Site Latency Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # 备份驱动（实际受 GitHub 节流限制）
  workflow_dispatch:
    inputs:
      force_all:
        description: '强制访问所有站点（忽略调度与次数限制）'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [tick]           # 主驱动：外部定时器经 /api/tick 触发

permissions:
  contents: write            # 允许把 history.json / last_run.json 提交回仓库

concurrency:
  group: latency-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run latency monitor
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            ARGS="--force"
          fi
          python monitor.py $ARGS

      - name: Commit and push results
        run: |
          git config user.name "latency-monitor[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add history.json last_run.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # 注意：commit 信息不要带 [skip ci] —— Vercel 会跳过带 [skip ci] 的提交，
            # 导致页面数据不随 Actions 更新
            git commit -m "chore: update latency history"
            git push
          fi
